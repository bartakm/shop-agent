[project]
name = "shop-agent"
version = "0.1.0"
description = "Customer-email agent for a small e-shop, with the shop's ERP exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=2.8.0",
    "mcp>=2.3.0",
]

[project.scripts]
shop-agent = "shop_agent:main"
shop-erp = "shop_agent.server:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
